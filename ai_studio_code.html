<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Canvas ルーレット - 完全自立型 1ファイルWebアプリ</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary-gradient: linear-gradient(135deg, #0284c7 0%, #3b82f6 50%, #6366f1 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 18px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
    }

    .brand p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-icon.active {
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .main-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 900px) {
      .main-layout {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    /* 左側: ルーレットステージ */
    .stage-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .result-banner {
      min-height: 54px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      text-align: center;
    }

    .winner-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      margin-left: 8px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.3rem;
      animation: pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .wheel-wrap {
      position: relative;
      width: 360px;
      height: 360px;
      max-width: 100%;
      margin: 10px 0 24px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#rouletteCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      cursor: pointer;
    }

    canvas#confettiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .spin-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      background: var(--primary-gradient);
      padding: 16px 52px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.7);
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }

    .hint-text {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* 右側: 設定パネル */
    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* プリセットボタン */
    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      background: rgba(51, 65, 85, 0.8);
      color: #ffffff;
      border-color: rgba(56, 189, 248, 0.4);
    }

    /* 項目リスト */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .items-list::-webkit-scrollbar {
      width: 6px;
    }
    .items-list::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 9999px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 10px;
      transition: border-color 0.15s;
    }

    .item-row:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .color-picker-wrap {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .color-picker-wrap input[type="color"] {
      position: absolute;
      inset: -10px;
      width: 50px;
      height: 50px;
      cursor: pointer;
      border: none;
    }

    .item-text-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 0.88rem;
      padding: 4px 6px;
      outline: none;
      border-radius: 6px;
    }

    .item-text-input:focus {
      background: rgba(30, 41, 59, 0.8);
    }

    .item-weight-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(30, 41, 59, 0.8);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .item-weight-input {
      width: 32px;
      background: transparent;
      border: none;
      color: #ffffff;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }

    .btn-delete:hover:not(:disabled) {
      color: #f87171;
      background: rgba(239, 68, 68, 0.15);
    }

    .btn-delete:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    /* 追加ボタン */
    .btn-add-item {
      background: rgba(15, 23, 42, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: #38bdf8;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-add-item:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.1);
      border-color: #38bdf8;
    }

    /* ツールボタン群 */
    .tools-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-tool {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      padding: 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .btn-tool:hover {
      background: rgba(51, 65, 85, 0.7);
      color: #fff;
    }

    /* 履歴ログ */
    .history-box {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 110px;
      overflow-y: auto;
      font-size: 0.78rem;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.4);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .history-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .history-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .history-time {
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    footer {
      margin-top: 30px;
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="brand">
      <div class="brand-icon">🎡</div>
      <div>
        <h1>HTML5 Canvas ルーレット</h1>
        <p>単一HTMLで完結する項目編集・物理回転・効果音付きルーレット</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="soundToggleBtn" class="btn-icon active" title="効果音のオン/オフ">
        <span id="soundIcon">🔊</span>
        <span id="soundLabel">サウンド: ON</span>
      </button>
      <button id="downloadHtmlBtn" class="btn-icon" title="この完全なHTMLファイルを保存">
        <span>💾</span>
        <span>HTML保存</span>
      </button>
    </div>
  </header>

  <!-- メイン2カラム配置 -->
  <main class="main-layout">

    <!-- 左側: ルーレットステージ -->
    <section class="stage-card">
      <div id="resultBanner" class="result-banner">
        「回す」ボタンでルーレットをスタート！
      </div>

      <div class="wheel-wrap">
        <canvas id="rouletteCanvas" width="720" height="720"></canvas>
        <canvas id="confettiCanvas" width="720" height="720"></canvas>
      </div>

      <button id="spinBtn" class="spin-btn">
        <span>▶</span>
        <span>ルーレットを回す (SPIN)</span>
      </button>

      <div class="hint-text">
        キャンバスクリック または <kbd style="background:#1e293b;padding:2px 6px;border-radius:4px;border:1px solid #334155;">Space</kbd> キーでも回転できます
      </div>
    </section>

    <!-- 右側: 項目設定パネル -->
    <aside class="panel-card">
      <div class="panel-header">
        <div class="panel-title">
          <span>⚙️</span>
          <span>ルーレット設定パネル</span>
        </div>
        <span id="itemCountBadge" style="font-size:0.75rem;background:rgba(56,189,248,0.15);color:#38bdf8;padding:2px 8px;border-radius:999px;font-weight:700;">
          4 項目
        </span>
      </div>

      <!-- プリセット切り替え -->
      <div>
        <div class="section-label">
          <span>プリセット項目</span>
        </div>
        <div class="preset-chips">
          <button class="preset-btn" data-preset="alphabet">基本 (A〜D)</button>
          <button class="preset-btn" data-preset="lunch">ランチ 🍜</button>
          <button class="preset-btn" data-preset="yesno">YES / NO ⭕❌</button>
          <button class="preset-btn" data-preset="roles">ミーティング役割 👥</button>
          <button class="preset-btn" data-preset="penalty">罰ゲーム 🎯</button>
          <button class="preset-btn" data-preset="dice">サイコロ (1〜6) 🎲</button>
        </div>
      </div>

      <!-- 編集可能な項目一覧 -->
      <div>
        <div class="section-label">
          <span>項目一覧（名前・色・比率）</span>
          <span style="font-size:0.7rem;color:#64748b;">(自動保存)</span>
        </div>

        <div id="itemsContainer" class="items-list">
          <!-- JSで動的に行を生成 -->
        </div>
      </div>

      <!-- 項目追加ボタン -->
      <button id="addItemBtn" class="btn-add-item">
        <span>＋</span>
        <span>新しい項目を追加</span>
      </button>

      <!-- 補助ツールボタン群 -->
      <div class="tools-bar">
        <button id="shuffleBtn" class="btn-tool" title="順番をランダムに並び替え">🔀 シャッフル</button>
        <button id="equalizeBtn" class="btn-tool" title="すべての比率を1に統一">⚖️ 比率均等化</button>
        <button id="resetBtn" class="btn-tool" title="A, B, C, Dの初期状態に戻す">🔄 リセット</button>
      </div>

      <!-- 当選履歴 -->
      <div class="history-box">
        <div class="section-label">
          <span>当選履歴</span>
          <button id="clearHistoryBtn" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:0.72rem;">クリア</button>
        </div>
        <div id="historyList" class="history-list">
          <div style="color:#64748b;text-align:center;padding:12px 0;">まだ当選履歴はありません</div>
        </div>
      </div>
    </aside>

  </main>

  <footer>
    HTML5 Canvas & Web Audio API Roulette • 外部フレームワーク不使用・単一ファイル完結
  </footer>

  <script>
    // ----------------------------------------------------
    // 1. データ定義とプリセット
    // ----------------------------------------------------
    const PALETTE = [
      '#EF4444', '#F97316', '#F59E0B', '#10B981', '#06B6D4',
      '#3B82F6', '#6366F1', '#8B5CF6', '#EC4899', '#14B8A6'
    ];

    const PRESETS = {
      alphabet: [
        { text: 'A', color: '#EF4444', weight: 1 },
        { text: 'B', color: '#3B82F6', weight: 1 },
        { text: 'C', color: '#10B981', weight: 1 },
        { text: 'D', color: '#F59E0B', weight: 1 }
      ],
      lunch: [
        { text: 'ラーメン 🍜', color: '#EF4444', weight: 1 },
        { text: 'カレーライス 🍛', color: '#F59E0B', weight: 1 },
        { text: 'お寿司 🍣', color: '#06B6D4', weight: 1 },
        { text: 'パスタ・ピザ 🍕', color: '#EC4899', weight: 1 },
        { text: '和食定食 🍱', color: '#10B981', weight: 1 }
      ],
      yesno: [
        { text: 'YES ⭕', color: '#10B981', weight: 1 },
        { text: 'NO ❌', color: '#EF4444', weight: 1 },
        { text: 'もう一回 🔄', color: '#3B82F6', weight: 1 }
      ],
      roles: [
        { text: '司会・ファシリ', color: '#6366F1', weight: 1 },
        { text: 'タイムキーパー', color: '#14B8A6', weight: 1 },
        { text: '議事録・書記', color: '#F97316', weight: 1 },
        { text: '発表・報告者', color: '#EC4899', weight: 1 }
      ],
      penalty: [
        { text: 'ものまね 🎭', color: '#EF4444', weight: 1 },
        { text: '最近の失敗談 🗣️', color: '#F59E0B', weight: 1 },
        { text: 'スクワット10回 🏋️', color: '#10B981', weight: 1 },
        { text: 'セーフ！🥳', color: '#3B82F6', weight: 1 }
      ],
      dice: [
        { text: '1', color: '#EF4444', weight: 1 },
        { text: '2', color: '#3B82F6', weight: 1 },
        { text: '3', color: '#10B981', weight: 1 },
        { text: '4', color: '#F59E0B', weight: 1 },
        { text: '5', color: '#8B5CF6', weight: 1 },
        { text: '6', color: '#06B6D4', weight: 1 }
      ]
    };

    // 初期データ復元（localStorage またはデフォルト）
    let items = [];
    try {
      const saved = localStorage.getItem('canvas_roulette_items');
      if (saved) items = JSON.parse(saved);
    } catch(e) {}
    if (!items || items.length < 2) {
      items = JSON.parse(JSON.stringify(PRESETS.alphabet));
    }

    let spinHistory = [];
    let isSpinning = false;
    let soundEnabled = true;

    // DOM要素参照
    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const resultBanner = document.getElementById('resultBanner');
    const itemsContainer = document.getElementById('itemsContainer');
    const addItemBtn = document.getElementById('addItemBtn');
    const itemCountBadge = document.getElementById('itemCountBadge');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundLabel = document.getElementById('soundLabel');
    const historyList = document.getElementById('historyList');

    // ----------------------------------------------------
    // 2. Web Audio API 音響エンジン（外部音源不要）
    // ----------------------------------------------------
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTick(intensity = 1) {
      if (!soundEnabled) return;
      try {
        const actx = getAudioCtx();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(620 + Math.random() * 100, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, actx.currentTime + 0.035);
        gain.gain.setValueAtTime(0.25 * intensity, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.04);
      } catch (e) {}
    }

    function playFanfare() {
      if (!soundEnabled) return;
      try {
        const actx = getAudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // ド, ミ, ソ, 高音ド
        notes.forEach((freq, i) => {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, actx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0, actx.currentTime + i * 0.1);
          gain.gain.linearRampToValueAtTime(0.25, actx.currentTime + i * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + i * 0.1 + 0.35);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start(actx.currentTime + i * 0.1);
          osc.stop(actx.currentTime + i * 0.1 + 0.4);
        });
      } catch (e) {}
    }

    // ----------------------------------------------------
    // 3. 紙吹雪（コンフェッティ）エンジン
    // ----------------------------------------------------
    function fireConfetti() {
      const w = confettiCanvas.width;
      const h = confettiCanvas.height;
      const particles = [];
      const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#38BDF8'];
      for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3;
        particles.push({
          x: w / 2, y: h / 2,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 3.5,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.2,
          alpha: 1
        });
      }
      function anim() {
        confettiCtx.clearRect(0, 0, w, h);
        let alive = false;
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.2;
          p.rot += p.vRot; p.alpha -= 0.015;
          if (p.alpha > 0) {
            alive = true;
            confettiCtx.save();
            confettiCtx.translate(p.x, p.y);
            confettiCtx.rotate(p.rot);
            confettiCtx.globalAlpha = p.alpha;
            confettiCtx.fillStyle = p.color;
            confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            confettiCtx.restore();
          }
        });
        if (alive) requestAnimationFrame(anim);
        else confettiCtx.clearRect(0, 0, w, h);
      }
      requestAnimationFrame(anim);
    }

    // ----------------------------------------------------
    // 4. キャンバス描画と物理回転
    // ----------------------------------------------------
    let currentAngle = 0;
    let angularVelocity = 0;
    let needleWobble = 0;
    let lastSliceIndex = -1;

    function getTotalWeight() {
      return items.reduce((sum, it) => sum + (Math.max(1, it.weight || 1)), 0);
    }

    function getWinnerIndex(angle) {
      if (items.length === 0) return 0;
      const total = getTotalWeight();
      const norm = ((-Math.PI / 2 - angle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      let cumulative = 0;
      for (let i = 0; i < items.length; i++) {
        const slice = ((items[i].weight || 1) / total) * (Math.PI * 2);
        if (norm >= cumulative && norm < cumulative + slice) return i;
        cumulative += slice;
      }
      return items.length - 1;
    }

    function drawWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = cx - 36;
      const totalWeight = getTotalWeight();

      ctx.clearRect(0, 0, w, h);

      // 外周ドロップシャドウ & リムベース
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 16, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.restore();

      // ゴールドメタリックリム
      const rimGrad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
      rimGrad.addColorStop(0, '#f59e0b');
      rimGrad.addColorStop(0.3, '#fbbf24');
      rimGrad.addColorStop(0.5, '#d97706');
      rimGrad.addColorStop(0.8, '#fef08a');
      rimGrad.addColorStop(1, '#b45309');
      ctx.beginPath();
      ctx.arc(cx, cy, r + 14, 0, Math.PI * 2);
      ctx.arc(cx, cy, r, 0, Math.PI * 2, true);
      ctx.fillStyle = rimGrad;
      ctx.fill();

      // リム上のスタッド（鋲）
      const numStuds = Math.max(16, items.length * 3);
      for (let s = 0; s < numStuds; s++) {
        const sAngle = (s / numStuds) * Math.PI * 2 + (currentAngle * 0.15);
        const sx = cx + Math.cos(sAngle) * (r + 7);
        const sy = cy + Math.sin(sAngle) * (r + 7);
        ctx.beginPath();
        ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = s % 2 === 0 ? '#ffffff' : '#fbbf24';
        ctx.fill();
      }

      // 各スライスの描画
      let startAngle = currentAngle;
      items.forEach((item) => {
        const sliceAngle = ((item.weight || 1) / totalWeight) * (Math.PI * 2);
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();

        // 3Dグラデーション
        const sliceGrad = ctx.createRadialGradient(cx, cy, 20, cx, cy, r);
        sliceGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
        sliceGrad.addColorStop(0.8, 'rgba(0, 0, 0, 0.02)');
        sliceGrad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
        ctx.fillStyle = sliceGrad;
        ctx.fill();

        // 境界線
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 文字描画
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        const fontSize = items.length > 12 ? 16 : items.length > 7 ? 22 : 30;
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;

        let display = item.text;
        const maxLen = items.length > 8 ? 8 : 12;
        if (display.length > maxLen) display = display.slice(0, maxLen - 1) + '…';
        ctx.fillText(display, r * 0.74, 0);
        ctx.restore();

        startAngle = endAngle;
      });

      // 中央ハブ
      ctx.beginPath();
      ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 32, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7';
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SPIN', cx, cy);

      // 上部ポインター（針）
      ctx.save();
      ctx.translate(cx, cy - r - 12);
      ctx.rotate(needleWobble);
      ctx.beginPath();
      ctx.moveTo(0, 30);
      ctx.lineTo(-16, -16);
      ctx.arcTo(0, -26, 16, -16, 12);
      ctx.lineTo(16, -16);
      ctx.closePath();
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    function spin() {
      if (isSpinning || items.length < 2) return;
      getAudioCtx();
      isSpinning = true;
      spinBtn.disabled = true;
      resultBanner.innerHTML = 'ルーレット回転中...';

      // 初期速度と摩擦減衰
      angularVelocity = 0.42 + Math.random() * 0.22;
      const friction = 0.988;

      function update() {
        angularVelocity *= friction;
        currentAngle = (currentAngle + angularVelocity) % (Math.PI * 2);

        const curSlice = getWinnerIndex(currentAngle);
        if (curSlice !== lastSliceIndex) {
          lastSliceIndex = curSlice;
          needleWobble = Math.min(0.24, angularVelocity * 0.8);
          playTick(Math.min(1, angularVelocity * 3));
        }
        needleWobble *= 0.8;
        drawWheel();

        if (angularVelocity < 0.0018) {
          isSpinning = false;
          spinBtn.disabled = false;
          needleWobble = 0;
          drawWheel();

          const winner = items[getWinnerIndex(currentAngle)];
          resultBanner.innerHTML = `🎉 当選結果: <span class="winner-badge" style="background-color: ${winner.color}">${winner.text}</span> に決定！`;
          playFanfare();
          fireConfetti();

          addHistory(winner);
          return;
        }
        requestAnimationFrame(update);
      }
      requestAnimationFrame(update);
    }

    // ----------------------------------------------------
    // 5. 設定パネルと項目管理（追加・編集・削除）
    // ----------------------------------------------------
    function saveItems() {
      try {
        localStorage.setItem('canvas_roulette_items', JSON.stringify(items));
      } catch(e) {}
    }

    function renderItemsPanel() {
      itemCountBadge.textContent = `${items.length} 項目`;
      itemsContainer.innerHTML = '';

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'item-row';

        row.innerHTML = `
          <div class="color-picker-wrap" style="background-color: ${item.color}">
            <input type="color" value="${item.color}" title="色を変更" data-index="${index}">
          </div>
          <input type="text" class="item-text-input" value="${item.text}" placeholder="項目名を入力" data-index="${index}">
          <div class="item-weight-wrap" title="比率・重み（大きいほど出やすい）">
            <span>比率</span>
            <input type="number" class="item-weight-input" min="1" max="99" value="${item.weight || 1}" data-index="${index}">
          </div>
          <button class="btn-delete" title="削除" data-index="${index}" ${items.length <= 2 ? 'disabled' : ''}>✕</button>
        `;

        itemsContainer.appendChild(row);
      });

      // イベントリスナー登録
      itemsContainer.querySelectorAll('input[type="color"]').forEach(el => {
        el.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index, 10);
          items[idx].color = e.target.value;
          e.target.parentElement.style.backgroundColor = e.target.value;
          saveItems();
          drawWheel();
        });
      });

      itemsContainer.querySelectorAll('.item-text-input').forEach(el => {
        el.addEventListener('input', (e) => {
          const idx = parseInt(e.target.dataset.index, 10);
          items[idx].text = e.target.value || `項目 ${idx + 1}`;
          saveItems();
          drawWheel();
        });
      });

      itemsContainer.querySelectorAll('.item-weight-input').forEach(el => {
        el.addEventListener('change', (e) => {
          const idx = parseInt(e.target.dataset.index, 10);
          const val = Math.max(1, parseInt(e.target.value, 10) || 1);
          items[idx].weight = val;
          e.target.value = val;
          saveItems();
          drawWheel();
        });
      });

      itemsContainer.querySelectorAll('.btn-delete').forEach(el => {
        el.addEventListener('click', (e) => {
          if (items.length <= 2 || isSpinning) return;
          const idx = parseInt(e.target.dataset.index, 10);
          items.splice(idx, 1);
          saveItems();
          renderItemsPanel();
          drawWheel();
        });
      });
    }

    // 新規項目追加
    addItemBtn.addEventListener('click', () => {
      if (items.length >= 24 || isSpinning) return;
      const nextIdx = items.length;
      const color = PALETTE[nextIdx % PALETTE.length];
      const letters = ['E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
      const defaultName = nextIdx < 4 ? `項目 ${nextIdx + 1}` : (letters[nextIdx - 4] || `項目 ${nextIdx + 1}`);

      items.push({
        text: defaultName,
        color: color,
        weight: 1
      });

      saveItems();
      renderItemsPanel();
      drawWheel();
    });

    // プリセットボタン
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isSpinning) return;
        const key = btn.dataset.preset;
        if (PRESETS[key]) {
          items = JSON.parse(JSON.stringify(PRESETS[key]));
          saveItems();
          renderItemsPanel();
          drawWheel();
          resultBanner.innerHTML = `プリセット「${btn.textContent}」を読み込みました`;
        }
      });
    });

    // シャッフル
    document.getElementById('shuffleBtn').addEventListener('click', () => {
      if (isSpinning) return;
      items.sort(() => Math.random() - 0.5);
      saveItems();
      renderItemsPanel();
      drawWheel();
    });

    // 比率均等化
    document.getElementById('equalizeBtn').addEventListener('click', () => {
      if (isSpinning) return;
      items.forEach(it => it.weight = 1);
      saveItems();
      renderItemsPanel();
      drawWheel();
    });

    // リセット
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (isSpinning) return;
      items = JSON.parse(JSON.stringify(PRESETS.alphabet));
      saveItems();
      renderItemsPanel();
      drawWheel();
      resultBanner.innerHTML = '初期状態 (A〜D) にリセットしました';
    });

    // ----------------------------------------------------
    // 6. 当選履歴
    // ----------------------------------------------------
    function addHistory(winner) {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
      spinHistory.unshift({ text: winner.text, color: winner.color, time: timeStr });
      if (spinHistory.length > 20) spinHistory.pop();
      renderHistory();
    }

    function renderHistory() {
      if (spinHistory.length === 0) {
        historyList.innerHTML = '<div style="color:#64748b;text-align:center;padding:12px 0;">まだ当選履歴はありません</div>';
        return;
      }
      historyList.innerHTML = spinHistory.map(h => `
        <div class="history-item">
          <div class="history-tag">
            <span class="history-dot" style="background-color: ${h.color}"></span>
            <span>${h.text}</span>
          </div>
          <span class="history-time">${h.time}</span>
        </div>
      `).join('');
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      spinHistory = [];
      renderHistory();
    });

    // ----------------------------------------------------
    // 7. サウンド切り替え & HTMLダウンロード
    // ----------------------------------------------------
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
      soundLabel.textContent = soundEnabled ? 'サウンド: ON' : 'サウンド: OFF';
      soundToggleBtn.classList.toggle('active', soundEnabled);
    });

    document.getElementById('downloadHtmlBtn').addEventListener('click', () => {
      const htmlContent = document.documentElement.outerHTML;
      const fullDoc = '<!DOCTYPE html>\n' + htmlContent;
      const blob = new Blob([fullDoc], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'roulette.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // ----------------------------------------------------
    // 8. キーボードショートカット & 初期起動
    // ----------------------------------------------------
    spinBtn.addEventListener('click', spin);
    canvas.addEventListener('click', spin);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpinning && document.activeElement?.tagName !== 'INPUT') {
        e.preventDefault();
        spin();
      }
    });

    // 初期レンダリング
    renderItemsPanel();
    drawWheel();
  </script>
</body>
</html>
